<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
  aria-labelledby="title desc">
  <title id="title">Club meetup illustration</title>
  <desc id="desc">Three stylized cars parked at a club meetup.</desc>
  <defs>
